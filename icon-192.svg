<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.55" stop-color="#5D3FD3"/>
      <stop offset="1" stop-color="#2E1B8F"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1A0B4E" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <ellipse cx="96" cy="26" rx="112" ry="56" fill="url(#hl)"/>
  <rect x="0" y="150" width="192" height="42" fill="#1A0B4E" opacity=".18"/>

  <g filter="url(#tShadow)">
    <text x="96" y="132" text-anchor="middle"
          font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="112" font-weight="600" fill="#ffffff" letter-spacing="-2">e</text>
  </g>
</svg>
