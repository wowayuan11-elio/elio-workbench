<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="0.55" stop-color="#5D3FD3"/>
      <stop offset="1" stop-color="#2E1B8F"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A0B4E" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- 渐变紫底，大圆角 -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- 顶部柔和高光 -->
  <ellipse cx="256" cy="70" rx="300" ry="150" fill="url(#hl)"/>
  <!-- 底部轻压暗，增加层次 -->
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#1A0B4E" opacity=".18"/>

  <!-- 白色小写 e -->
  <g filter="url(#tShadow)">
    <text x="256" y="352" text-anchor="middle"
          font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif"
          font-size="300" font-weight="600" fill="#ffffff" letter-spacing="-6">e</text>
  </g>
</svg>
